name: brief
on:
  schedule: [{cron: "45 2 * * 1-5"}, {cron: "30 10 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: data, cancel-in-progress: false}
env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python prices.py
      - run: python screener.py
      - run: python brief.py
      - run: |
          git config user.name bot
          git config user.email bot@x.com
          git add -A
          git diff --staged --quiet || (git commit -m update && git pull --rebase -q && git push)
